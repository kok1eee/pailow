[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pailow"
version = "0.1.0"
description = "Container-based text overlay CLI for images — bridge between Pillow and LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "pailow"}]
dependencies = [
    "pillow>=13.0.0",
    "typer>=0.12",
    "rich>=13.0",
    "watchdog>=4.0",
    "textual>=0.50",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[project.scripts]
pailow = "pailow.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
